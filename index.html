<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            // Get the base path from the base tag
            const base = document.querySelector('base');
            const basePath = base ? base.getAttribute('href') : '/';

            // Construct the service worker path relative to base
            const swPath = basePath + 'firebase-messaging-sw.js';

            console.log('Registering FCM Service Worker at:', swPath);

            // Register the Service Worker with the correct scope
            navigator.serviceWorker.register(swPath, {
                scope: basePath
            })
                .then((registration) => {
                    console.log('FCM Service Worker registered:', registration);
                })
                .catch((error) => {
                    console.error('FCM Service Worker registration failed:', error);
                });
        });
    }
</script>
